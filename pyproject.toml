[project]
name = "agentforge"
version = "0.0.1"
description = "A 25-agent AI engineering platform with a multi-agent orchestrator"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Arunkumar" }]
dependencies = [
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "structlog>=26.1.0",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.16.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "integration: needs external services (DB, network)",
  "llm: calls a real LLM provider (skipped in CI)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "W",   # pycodestyle
  "F",        # pyflakes
  "I",        # isort (import order)
  "B",        # flake8-bugbear (likely bugs)
  "UP",       # pyupgrade (modern syntax)
  "SIM",      # flake8-simplify
  "N",        # pep8-naming
  "S",        # flake8-bandit (security)
  "ASYNC",    # async pitfalls
  "RUF",      # ruff-specific rules
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert is fine in tests

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["agentforge"]
warn_unreachable = true
pretty = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.coverage.run]
source = ["agentforge"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 80
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "@abstractmethod"]
