[project]
name = "agentforge"
version = "0.0.1"
description = "A 25-agent AI engineering platform with a multi-agent orchestrator"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Arunkumar" }]
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "integration: needs external services (DB, network)",
  "llm: calls a real LLM provider (skipped in CI)",
]
